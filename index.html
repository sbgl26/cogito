<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cogito</title>
<meta name="description" content="Carnet de jeux de logique : Sudoku, Killer Sudoku, Nonogram. Jouable hors connexion.">
<meta name="theme-color" content="#F6F7FB">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cogito">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // Applique le thème enregistré avant le premier affichage (évite un flash).
  try {
    var s = JSON.parse(localStorage.getItem('cogito:settings') || '{}');
    if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
    document.documentElement.dataset.hand = s.hand === false ? '0' : '1';
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<div id="layer"></div>
<noscript><p style="padding:24px">Cogito a besoin de JavaScript pour fonctionner.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
